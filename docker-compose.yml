version: "3.9"

services:
  nous:
    build: .
    container_name: nous-ai-os
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./apps:/app/apps
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
